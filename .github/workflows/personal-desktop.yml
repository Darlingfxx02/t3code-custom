name: Build personal desktop releases
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for both installers
        required: true
        type: string
      platform:
        description: Platforms to build
        type: choice
        default: both
        options:
          - both
          - windows
          - macos
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform == 'mac' && 'macOS Apple Silicon' || 'Windows x64' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'windows' && '["win"]' || inputs.platform == 'macos' && '["mac"]' || '["mac","win"]') }}
    runs-on: ${{ matrix.platform == 'mac' && 'macos-15' || 'windows-2025' }}
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      T3CODE_TELEMETRY_ENABLED: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/desktop... --filter t3... --filter @t3tools/web... --filter @t3tools/monorepo --filter @t3tools/scripts...
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Build installer and validate packaged runtime
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          vp run dist:desktop:artifact --platform "${{ matrix.platform }}" --target "${{ matrix.platform == 'mac' && 'dmg' || 'nsis' }}" --arch "${{ matrix.platform == 'mac' && 'arm64' || 'x64' }}" --build-version "$RELEASE_VERSION" --output-dir release --keep-stage --verbose
      - name: Locate packaged app
        id: app
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          const prefix = `t3code-desktop-${process.env.PLATFORM}-stage-`;
          const stages = fs.readdirSync(os.tmpdir()).filter(n => n.startsWith(prefix));
          if (stages.length !== 1) throw new Error(`Expected one build stage, got ${stages.length}`);
          const dist = path.join(os.tmpdir(), stages[0], 'app', 'dist');
          const dir = fs.readdirSync(dist).find(n => process.env.PLATFORM === 'mac' ? n.startsWith('mac') : n.startsWith('win') && n.endsWith('-unpacked'));
          if (!dir) throw new Error('Packaged app directory not found');
          const executable = process.env.PLATFORM === 'mac'
            ? path.join(dist, dir, 'T3 Code (Beta).app', 'Contents', 'MacOS', 'T3 Code (Beta)')
            : path.join(dist, dir, 'T3 Code (Beta).exe');
          if (!fs.existsSync(executable)) throw new Error(`Missing executable: ${executable}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `executable=${executable}\n`);
          JS
      - name: Launch packaged app with isolated test data
        env:
          DEBUG: pw:browser
        run: env -u ELECTRON_RUN_AS_NODE node --unhandled-rejections=warn scripts/smoke-desktop-app.ts --executable "${{ steps.app.outputs.executable }}" --artifacts-dir desktop-launch-check
      - name: Create checksums
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const files = fs.readdirSync('release').filter(n => /\.(dmg|zip|exe|blockmap|yml)$/.test(n) && !n.startsWith('builder-')).sort();
          const checksums = files.map(n => `${crypto.createHash('sha256').update(fs.readFileSync('release/' + n)).digest('hex')}  ${n}`);
          fs.writeFileSync('release/SHA256SUMS-${{ matrix.platform }}-${{ matrix.platform == 'mac' && 'arm64' || 'x64' }}.txt', checksums.join('\n') + '\n');
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.platform == 'mac' && 'arm64' || 'x64' }}
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS-*.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: launch-diagnostics-${{ matrix.platform }}
          path: desktop-launch-check/
